name: Investigate issue 172 Rust bindings
on:
  push:
    branches: [investigate/issue-172-msvc]
    paths:
      - .github/workflows/issue-172-rust.yml
      - .github/issue-172/rust/**
      - ct2rs-sys/build.rs
permissions:
  contents: read
jobs:
  rust-msvc:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        mode: [manual-isa]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Restore original build script for baseline
        if: matrix.mode == 'baseline'
        shell: pwsh
        run: git show 12f8df7:ct2rs-sys/build.rs | Set-Content ct2rs-sys/build.rs
      - name: Isolate the whole-archive change
        if: matrix.mode == 'whole-archive'
        shell: pwsh
        run: |
          $source = (git show 12f8df7:ct2rs-sys/build.rs) -join "`n"
          $old = 'println!("cargo:rustc-link-lib=static={}", library_name(name));'
          $new = 'if library_name(name) == "ctranslate2" { println!("cargo:rustc-link-lib=static:+whole-archive=ctranslate2"); } else { println!("cargo:rustc-link-lib=static={}", library_name(name)); }'
          if (-not $source.Contains($old)) { throw "Could not find native link directive" }
          $source.Replace($old, $new) | Set-Content ct2rs-sys/build.rs
      - name: Optimize both native libraries and CXX bridge
        if: startsWith(matrix.mode, 'bridge-opt')
        shell: pwsh
        run: |
          $source = (git show fd8d938:ct2rs-sys/build.rs) -join "`n"
          $source = $source.Replace('.std("c++17")', '.std("c++17").opt_level(2)')
          if ('${{ matrix.mode }}' -eq 'bridge-opt3') {
            $source = $source.Replace('.cxxflag("/EHsc")', '.cxxflag("/EHsc").cxxflag("/Ob3")')
            $source = $source.Replace('.std("c++17").opt_level(2)', '.std("c++17").opt_level(2).flag("/Ob3")')
          }
          $source | Set-Content ct2rs-sys/build.rs
      - name: Disable CTranslate2 CPU dispatch
        if: matrix.mode == 'no-dispatch'
        shell: pwsh
        run: git show 12f8df7:ct2rs-sys/build.rs | Set-Content ct2rs-sys/build.rs
      - name: Restrict automatic code generation to baseline ISA
        if: matrix.mode == 'manual-isa'
        shell: pwsh
        run: |
          git show 12f8df7:ct2rs-sys/build.rs | Set-Content ct2rs-sys/build.rs
          foreach ($file in @('ct2rs-sys/CTranslate2/CMakeLists.txt', 'ct2rs-sys/CTranslate2/third_party/ruy/ruy/CMakeLists.txt')) {
            $separator = if ($file.Contains('third_party')) { ';' } else { ' ' }
            $source = Get-Content $file -Raw
            $source = $source.Replace('"/arch:AVX512"', ('"/D__AVX__' + $separator + '/D__AVX2__' + $separator + '/D__AVX512F__' + $separator + '/D__AVX512CD__' + $separator + '/D__AVX512VL__' + $separator + '/D__AVX512BW__' + $separator + '/D__AVX512DQ__"'))
            $source = $source.Replace('"/arch:AVX2"', ('"/D__AVX__' + $separator + '/D__AVX2__"'))
            $source = $source.Replace('"/arch:AVX"', '"/D__AVX__"')
            $source | Set-Content $file
          }
      - name: Build Rust Whisper probe
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static,+sse4.1
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          $env:RUSTFLAGS += " -Clink-arg=/MAP:$env:RUNNER_TEMP/probe.map"
          $features = @()
          if ('${{ matrix.mode }}' -eq 'no-dispatch') {
            $features = @('--features', 'ct2rs-sys/disable-cpu-dispatch')
          }
          cargo build --manifest-path .github/issue-172/rust/Cargo.toml --target-dir "$env:RUNNER_TEMP/rust-target" @features 2>&1 | Tee-Object "$env:RUNNER_TEMP/rust-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/rust-build.log
            ${{ runner.temp }}/probe.map
            ${{ runner.temp }}/rust-target/debug/issue-172-rust-probe.exe
            ${{ runner.temp }}/rust-target/debug/issue-172-rust-probe.pdb
            ${{ runner.temp }}/rust-target/debug/build/**/CMakeCache.txt
