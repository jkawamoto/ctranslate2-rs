name: Investigate issue 172 Rust bindings
on:
  push:
    branches: [investigate/issue-172-msvc]
    paths:
      - .github/workflows/issue-172-rust.yml
      - .github/issue-172/rust/**
      - ct2rs-sys/build.rs
permissions:
  contents: read
jobs:
  rust-msvc:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, fixed]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Restore original build script for baseline
        if: matrix.mode == 'baseline'
        shell: pwsh
        run: git show 12f8df7:ct2rs-sys/build.rs | Set-Content ct2rs-sys/build.rs
      - name: Build Rust Whisper probe
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static,+sse4.1
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          cargo build --manifest-path .github/issue-172/rust/Cargo.toml --target-dir "$env:RUNNER_TEMP/rust-target" 2>&1 | Tee-Object "$env:RUNNER_TEMP/rust-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/rust-build.log
            ${{ runner.temp }}/rust-target/debug/issue-172-rust-probe.exe
            ${{ runner.temp }}/rust-target/debug/build/**/CMakeCache.txt
