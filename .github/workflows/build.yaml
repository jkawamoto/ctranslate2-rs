name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Set up pre-commit cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-
      - name: Run pre-commit
        run: mise run pre-commit

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        backend: [ruy, accelerate]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}
          cache-on-failure: true
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: macos-test-data
      - name: Build
        run: cargo build -p ct2rs --no-default-features -F "all-tokenizers,whisper,hub,${{ matrix.backend }}"
      - name: Run tests
        run: cargo test -p ct2rs --no-default-features -F "all-tokenizers,whisper,hub,${{ matrix.backend }}" -- --include-ignored

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        backend: [ruy, mkl, openblas, dnnl]
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: "-march=x86-64"
      LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
      OPENBLAS_TARGET: CORE2

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}
          cache-on-failure: true
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: linux-test-data
      - name: Build
        run: cargo build -p ct2rs --no-default-features -F "all-tokenizers,whisper,hub,${{ matrix.backend }}"
      - name: Run tests
        run: cargo test -p ct2rs --no-default-features -F "all-tokenizers,whisper,hub,${{ matrix.backend }}" -- --include-ignored
        if: ${{ matrix.backend != 'mkl' && matrix.backend != 'dnnl' }}

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        backend: [openblas, ruy, dnnl, mkl]
    runs-on: windows-latest
    steps:
      - uses: actions/cache@v6
        with:
          path: C:/vcpkg/installed
          key: cache-vcpkg-packages
      - name: Install OpenBLAS
        if: ${{ matrix.backend == 'openblas' }}
        run: |
          vcpkg install openblas:x64-windows-static
          vcpkg integrate install
          echo "CMAKE_INCLUDE_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/include/openblas;$env:CMAKE_INCLUDE_PATH" >> $env:GITHUB_ENV
          echo "CMAKE_LIBRARY_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib;$env:CMAKE_LIBRARY_PATH" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}
          cache-on-failure: true
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: windows-test-data
      - name: Build
        run: cargo build -p ct2rs --no-default-features -F "all-tokenizers,whisper,hub,${{ matrix.backend }}"
      - name: Run tests
        run: cargo test -p ct2rs --no-default-features -F "all-tokenizers,whisper,hub,${{ matrix.backend }}" -- --include-ignored
        if: ${{ matrix.backend != 'mkl' }}

  docs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: ${{ runner.os }}-docs-rust-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-rust-
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - run: mise run doc
