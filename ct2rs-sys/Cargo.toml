[package]
name = "ct2rs-sys"
version.workspace = true
authors.workspace = true
categories = ["api-bindings"]
documentation = "https://docs.rs/ct2rs-sys"
edition.workspace = true
keywords = ["ctranslate2", "bindings", "llm", "whisper"]
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Raw Rust bindings for OpenNMT/CTranslate2"
include = [
    "/include",
    "/src",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/CTranslate2/CMakeLists.txt",
    "/CTranslate2/LICENSE",
    "/CTranslate2/cmake",
    "/CTranslate2/cpp",
    "/CTranslate2/include",
    "/CTranslate2/python",
    "/CTranslate2/src",
    "/CTranslate2/third_party",
    "!/CTranslate2/**/.*",
    "!/CTranslate2/**/test",
    "!/CTranslate2/**/docs",
    "!/CTranslate2/**/media",
    "!/CTranslate2/third_party/thrust/libcudacxx/*.md",
]

[lib]
name = "ct2rs_sys"

[dependencies]
anyhow = "1.0"
cxx = { version = "1.0", features = ["c++17"] }
intel-onemkl-prebuild = { version = "0.2", optional = true }
onednn-src = { version = "0.1", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
openblas-src = { version = "0.10", features = ["static"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
openblas-src = { version = "0.10", features = ["static", "system"], optional = true }

[build-dependencies]
cmake = "0.1"
cxx-build = "1.0"
walkdir = "2.5"

[features]
default = ["ruy", "cuda-small-binary"]
system = ["intel-onemkl-prebuild?/system", "openblas-src?/system"]

# Features to select backends.
cuda = []
cudnn = ["cuda"]
mkl = ["dep:intel-onemkl-prebuild"]
system-mkl = ["mkl", "intel-onemkl-prebuild/system"]
openblas = ["dep:openblas-src"]
dnnl = ["dep:onednn-src"]
ruy = []
accelerate = []
openmp-runtime-comp = []
openmp-runtime-intel = []
disable-cpu-dispatch = []

# Features to enable GPU functionality.
flash-attention = []
tensor-parallel = []
cuda-dynamic-loading = ["cuda"]
cuda-small-binary = []
