[package]
name = "ct2rs"
version.workspace = true
authors.workspace = true
categories = ["api-bindings"]
documentation = "https://docs.rs/ct2rs"
edition.workspace = true
include = [
    "/include",
    "/src",
    "/LICENSE",
    "/examples",
]
keywords = ["ctranslate2", "bindings", "llm", "whisper"]
license.workspace = true
readme = "../README.md"
repository.workspace = true
description = "Rust bindings for OpenNMT/CTranslate2"

[dependencies]
anyhow = "1.0"
ct2rs-sys = { version = "=0.10.2", path = "../ct2rs-sys", default-features = false }
sentencepiece = { version = "0.13", optional = true }
tokenizers = { version = "0.22", optional = true }

# Dependencies for Whisper model
mel_spec = { version = "0.3", optional = true }
ndarray = { version = "0.16", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Dependencies for Hugging Face integration
hf-hub = { version = "0.4", optional = true }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
ureq = "2.10"

# Dependencies for Whisper example
hound = { version = "3.5.1" }

[features]
default = ["all-tokenizers", "ct2rs-sys/ruy", "ct2rs-sys/cuda-small-binary"]
whisper = [
    "dep:mel_spec",
    "dep:ndarray",
    "dep:serde",
    "dep:serde_json",
    "all-tokenizers",
]
hub = ["dep:hf-hub"]
system = ["ct2rs-sys/system"]

# Features to select backends.
cuda = ["ct2rs-sys/cuda"]
cudnn = ["ct2rs-sys/cudnn"]
mkl = ["ct2rs-sys/mkl"]
system-mkl = ["ct2rs-sys/system-mkl"]
openblas = ["ct2rs-sys/openblas"]
dnnl = ["ct2rs-sys/dnnl"]
ruy = ["ct2rs-sys/ruy"]
accelerate = ["ct2rs-sys/accelerate"]
openmp-runtime-comp = ["ct2rs-sys/openmp-runtime-comp"]
openmp-runtime-intel = ["ct2rs-sys/openmp-runtime-intel"]
disable-cpu-dispatch = ["ct2rs-sys/disable-cpu-dispatch"]

# Features to enable GPU functionality.
flash-attention = ["ct2rs-sys/flash-attention"]
tensor-parallel = ["ct2rs-sys/tensor-parallel"]
cuda-dynamic-loading = ["ct2rs-sys/cuda-dynamic-loading"]
cuda-small-binary = ["ct2rs-sys/cuda-small-binary"]

# Futures to select tokenizers.
all-tokenizers = ["sentencepiece", "tokenizers"]
sentencepiece = ["dep:sentencepiece"]
tokenizers = ["dep:tokenizers"]

[[example]]
name = "bart"

[[example]]
name = "bloom"

[[example]]
name = "falcon"

[[example]]
name = "marian-mt"

[[example]]
name = "mpt"

[[example]]
name = "nllb"

[[example]]
name = "gpt-2"

[[example]]
name = "gpt-j"

[[example]]
name = "gpt-neox"

[[example]]
name = "opt"
required-features = ["tokenizers"]

[[example]]
name = "t5"

[[example]]
name = "stream"

[[example]]
name = "whisper"
required-features = ["whisper"]

[package.metadata.docs.rs]
features = ["whisper", "hub"]
