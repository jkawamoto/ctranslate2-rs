[workspace]
channels = ["conda-forge"] # https://prefix.dev/conda-forge
name = "ctranslate2-rs-workspace"
platforms = [
    { platform = "linux-64", cuda = "12.9" },
]
version = "0.2.0"
preview = ["pixi-build"]

[package]
name = "ctranslate2-rs"
version = "0.10.1"
homepage = "https://github.com/jkawamoto/ctranslate2-rs"
repository = "https://github.com/jkawamoto/ctranslate2-rs"

[package.build]
backend = { name = "pixi-build-rust", version = "*" }

[package.build.config]
compilers = ["rust", "c", "cxx"]

[tasks]
clean = "cargo clean"
check = "cargo check -p ct2rs"
build = "cargo build --release"
test = "cargo test --workspace"

[tasks.doc]
cmd = "cargo rustdoc -F whisper,hub -p ct2rs -- --cfg docsrs"
default-environment = "hub"
env = { RUSTC_BOOTSTRAP = "1", RUSTDOCFLAGS = "--cfg docsrs" }

[tasks.doc-platform]
cmd = "cargo rustdoc -F whisper,hub -p ct2rs-platform -- --cfg docsrs"
default-environment = "platform"
env = { RUSTC_BOOTSTRAP = "1", RUSTDOCFLAGS = "--cfg docsrs" }

[dependencies]
rust = "*"
rust-src = ">=1.98.1,<2"

cuda-version = "12.9.*"
cudnn = "8.*"
cuda-nvcc = "*"
libcublas-dev = "*"

compilers = ">=1.8.0"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"

sccache = ">=0.17.0,<0.18" # TODO we must configurate sccache ASAP!

[activation.env]
CFLAGS = "$CFLAGS -pthread"
CXXFLAGS = "$CXXFLAGS -pthread"
CUDA_ARCH_LIST = "Auto"
CUDA_TOOLKIT_ROOT_DIR = "$CONDA_PREFIX/targets/x86_64-linux"
CUDA_PATH = "$CONDA_PREFIX/targets/x86_64-linux"

[environments]
default = []
# TODO this must be completed with all dependencies required by `ct2rs-platform`
platform = ["platform-cuda", "tensor-parallel", "hub"]
hub = ["hub"]

[feature.tensor-parallel.dependencies]
openmpi = "*"
nccl = "*"

[feature.platform-cuda.dependencies]
cuda-cudart-dev = "*"
libcurand-dev = "*"

[feature.platform-cuda.activation.env]
PATH = "$CONDA_PREFIX/nvvm/bin:$PATH"

[feature.hub.dependencies]
openssl = ">=3.6.4,<4"
pkg-config = ">=0.29.2,<0.30"
